<div class="page-container">
  <div class="student-card">
    <div class="card-header">
      <div class="header-left">
        <span class="student-icon">👤</span>
        <span class="section-title">Student Information</span>
      </div>
      <span class="section-subtitle">Personal details</span>
    </div>
    <form [formGroup]="studentForm" (ngSubmit)="onSubmit()">

      <div class="form-content">
        <div class="form-row">

          <div class="form-group">
            <div class="input-box">
              <span class="field-icon">👤</span>
              <input
                type="text"
                formControlName="firstName"
                placeholder="First Name*"
              />
            </div>
            <small *ngIf="f['firstName'].touched &&
                          f['firstName'].hasError('required')">
              First name is required.
            </small>
          </div>
          <div class="form-group">
            <div class="input-box">
              <i class="fa-regular fa-user"></i> 
              <input
                type="text"
                formControlName="lastName"
                placeholder="Last Name*"
              />
            </div>
            <small *ngIf="f['lastName'].touched &&
                          f['lastName'].hasError('required')">
              Last name is required.
            </small>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <div class="input-box">
              <span class="field-icon">✉</span>
              <input
                type="email"
                formControlName="email"
                placeholder="Email*"
              />
            </div>
            <small *ngIf="f['email'].touched &&
                          f['email'].invalid">
              Enter a valid email.
            </small>
          </div>
          <div class="form-group">
            <div class="input-box">
              <span class="material-icons field-icon">call</span>
              <input
                type="tel"
                formControlName="contact"
                maxlength="10"
                placeholder="Contact*"
              />
            </div>
            <small *ngIf="f['contact'].touched &&
                          f['contact'].invalid">
              Enter a valid 10-digit number.
            </small>
          </div>
        </div>
        <div class="form-group gender-group">
          <div class="input-box">
            <span class="gender-icons">
              <i class="fa-solid fa-person field-icon"></i>
              <i class="fa-solid fa-person-dress field-icon"></i>
            </span>
            <select formControlName="gender">
              <option value="">Gender*</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
            <span class="dropdown-icon">▼</span>
          </div>
          <small *ngIf="f['gender'].touched &&
                        f['gender'].invalid">
            Please select gender.
          </small>
        </div>
        <div class="photo-upload">
          <div class="profile-circle">
            <img
              *ngIf="selectedPhoto; else defaultIcon"
              [src]="selectedPhoto"
              alt="Profile Photo"
            />
            <ng-template #defaultIcon>
              <span class="default-profile">👤</span>
            </ng-template>
          </div>
          <div class="upload-content">
            <input
              #photoInput
              type="file"
              accept="image/jpeg,image/png,image/webp"
              hidden
              (change)="onPhotoSelected($event)"
            />
            <button
              type="button"
              class="upload-btn"
              (click)="photoInput.click()">
              <span>⬆</span> Upload Photo
            </button>
            <p>Optional · JPG, PNG, WEBP · Max 2 MB</p>
          </div>
        </div>
<div class="form-actions">
  <button
    type="button"
    class="cancel-btn"
    (click)="studentForm.reset()">
    Cancel
  </button>

  <button
    type="submit"
    class="create-btn">
    Create Student
  </button>
</div>
